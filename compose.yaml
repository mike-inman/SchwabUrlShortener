name: schwab-url-shortener

# Existing local data volumes are supplied explicitly during the first
# migration. New installations create these named volumes before startup.
services:
  postgres:
    image: postgres:16-alpine
    container_name: schwab-url-shortener-postgres
    network_mode: bridge
    env_file:
      - ${SCHWAB_POSTGRES_ENV_FILE:?Set SCHWAB_POSTGRES_ENV_FILE to a local password file}
    environment:
      POSTGRES_USER: schwab_local
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:63651:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U schwab_local -d postgres"]
      interval: 10s
      timeout: 3s
      retries: 6

  redis:
    image: redis:7-alpine
    container_name: schwab-url-shortener-redis
    network_mode: bridge
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:63652:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  kafka:
    image: apache/kafka:4.1.2
    container_name: schwab-url-shortener-kafka
    network_mode: bridge
    environment:
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_NODE_ID: "1"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:63653
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
    ports:
      - "127.0.0.1:63653:9092"
    volumes:
      - kafkadata:/var/lib/kafka/data
      - kafkasecrets:/etc/kafka/secrets
      - kafkaconfig:/mnt/shared/config
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9092'"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

volumes:
  pgdata:
    external: true
    name: ${SCHWAB_PG_VOLUME:-schwab-url-shortener-pgdata}
  redisdata:
    external: true
    name: ${SCHWAB_REDIS_VOLUME:-schwab-url-shortener-redis-data}
  kafkadata:
    external: true
    name: ${SCHWAB_KAFKA_DATA_VOLUME:-schwab-url-shortener-kafka-data}
  kafkasecrets:
    external: true
    name: ${SCHWAB_KAFKA_SECRETS_VOLUME:-schwab-url-shortener-kafka-secrets}
  kafkaconfig:
    external: true
    name: ${SCHWAB_KAFKA_CONFIG_VOLUME:-schwab-url-shortener-kafka-config}
