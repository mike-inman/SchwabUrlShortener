# Optional real local HTTPS endpoint for OIDC callback https://localhost:63656/signin-oidc.
# Supply the encrypted PFX and its password through local, untracked configuration.
services:
  web:
    environment:
      ASPNETCORE_URLS: http://+:8080;https://+:8443
      ASPNETCORE_HTTPS_PORT: "63656"
      ASPNETCORE_Kestrel__Certificates__Default__Path: /https/shortener.pfx
      ASPNETCORE_Kestrel__Certificates__Default__Password: ${SCHWAB_WEB_CERT_PASSWORD:?Set local certificate password}
    volumes:
      - ${SCHWAB_WEB_CERT_FILE:?Set local certificate PFX path}:/https/shortener.pfx:ro
    ports:
      - "127.0.0.1:63656:8443"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--insecure", "https://127.0.0.1:8443/health/ready"]
